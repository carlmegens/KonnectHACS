get_content:
  name: Read content
  description: Read a bounded, private response from one account. Administrators and trusted automations only. Nothing is sent to the childcare provider.
  fields:
    config_entry_id:
      name: Account
      required: true
      selector:
        config_entry:
          integration: ouderapp
    kind:
      name: Content
      required: true
      selector:
        select:
          options:
            - timeline
            - news
            - newsletters
            - conversations
            - messages
    limit:
      name: Maximum items
      default: 10
      selector:
        number:
          min: 1
          max: 20
          mode: box
    conversation:
      name: Conversation ID
      description: Required for messages. Use conversation_id returned by conversations.
      selector:
        text:
    article:
      name: Article ID
      description: Optional for news or newsletters. Use article_id from the same account and source to read one article.
      selector:
        text:

get_planning:
  name: Read childcare planning
  description: Read up to 31 days of childcare slots. End date is exclusive, in Europe/Amsterdam. Administrators and trusted automations only; returned data is private.
  fields:
    format:
      name: Response format
      description: JSON planning or an ICS snapshot in the calendar response field. ICS requires a non-empty, untruncated response without an offline warning. No file is written automatically.
      default: json
      selector:
        select:
          options:
            - json
            - ics
    config_entry_id:
      name: Account
      required: true
      selector:
        config_entry:
          integration: ouderapp
    start_date:
      name: Start date (inclusive)
      required: true
      selector:
        date:
    end_date:
      name: End date (exclusive)
      required: true
      selector:
        date:
    limit:
      name: Maximum slots
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: box
