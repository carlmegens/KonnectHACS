name: Integration checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Home Assistant and distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check code and formatting
        run: |
          python -m ruff check custom_components tests scripts
          python -m ruff format --check custom_components tests scripts
      - name: Test with synthetic Home Assistant accounts
        run: python -m pytest --tb=short
      - name: Build and verify allowlisted packages
        run: python scripts/prepare_repository.py

  browser:
    name: Chromium card and panel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and operating system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check ../../custom_components/ouderapp/frontend/ouderapp-card.js
          node --check harness.js
          node --check test-card.mjs
      - name: Run synthetic browser checks
        run: |
          node serve.mjs &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:8776/tests/frontend/index.html > /dev/null
          npm test
